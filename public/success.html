<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Study Guide - StudyScribe AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <header>
            <div class="logo">StudyScribe AI</div>
            <p class="tagline">Payment Successful. Generating your premium guide...</p>
        </header>

        <main>
            <div class="clean-card result-card">
                <div id="loader" class="loader">🧠 AI is thinking...</div>
                <div id="resultContent" class="markdown-body" style="display: none; white-space: pre-wrap; text-align: left;"></div>
            </div>
            <a href="/" class="primary-btn" style="display: block; width: 200px; margin: 30px auto; text-align: center; text-decoration: none;">Generate Another</a>
        </main>
    </div>

    <script>
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('job_id');
            const sessionId = urlParams.get('session_id');

            if (!jobId || !sessionId) {
                document.getElementById('loader').innerText = "Error: Invalid Session.";
                return;
            }

            try {
                const response = await fetch('/generate-guide', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jobId })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('loader').innerText = "Error: " + data.error;
                    return;
                }

                document.getElementById('loader').style.display = 'none';
                document.getElementById('resultContent').style.display = 'block';
                document.getElementById('resultContent').innerText = data.guide;
            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerText = "Failed to communicate with AI.";
            }
        };
    </script>
</body>
</html>
